name: Deploy ZYN Empire to GCP VM

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VM_IP: 35.185.40.28
  VM_USER: zion
  VM_DIR: /home/zion/zyn

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --production

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.VM_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          ssh-add ~/.ssh/deploy_key

      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${VM_USER}@${VM_IP} << 'EOF'
            echo "━━━ ZYN EMPIRE DEPLOY START ━━━"
            cd ${VM_DIR}

            # Stash any local changes
            git stash 2>/dev/null || true

            # Pull latest from main
            git checkout main
            git pull origin main

            # Install npm dependencies
            npm install --production

            # Make scripts executable
            chmod +x setup_empire.sh repair_zyn.sh jitro_autopilot.sh DEPLOY.sh 2>/dev/null

            # Stop existing bots
            pm2 stop noah-manager 2>/dev/null || true
            pm2 stop auto-reports 2>/dev/null || true
            pm2 stop zyn-agents 2>/dev/null || true

            # Start all bots
            pm2 start noah_discord.js --name noah-manager
            pm2 start auto_reports.js --name auto-reports
            pm2 start agents.js --name zyn-agents

            # Save PM2 state
            pm2 save

            echo "━━━ DEPLOY COMPLETE ━━━"
            pm2 list
            echo "━━━━━━━━━━━━━━━━━━━━━━━"
          EOF

      - name: Health Check
        run: |
          sleep 10
          curl -sf http://${{ env.VM_IP }}:80/ > /dev/null && echo "✅ Dashboard is live" || echo "⚠️ Dashboard check failed"
          curl -sf http://${{ env.VM_IP }}:80/dashboard.html > /dev/null && echo "✅ Dashboard HTML ok" || echo "⚠️ Dashboard HTML check failed"

      - name: Discord Notification
        if: always()
        run: |
          if [ "${{ secrets.DISCORD_WEBHOOK_URL }}" != "" ]; then
            STATUS="✅ Deployment successful"
            if [ "${{ job.status }}" != "success" ]; then
              STATUS="❌ Deployment failed"
            fi
            curl -sf -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"${STATUS}\nBranch: main\nCommit: ${{ github.sha }}\nVM: ${{ env.VM_IP }}\"}" \
              || true
          fi